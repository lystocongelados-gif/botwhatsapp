<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>LYSTO — Pedidos</title>
<style>
  :root {
    --brand: #d5342a;
    --brand-dark: #b3271f;
    --bg: #f4f2ee;
    --card: #ffffff;
    --text: #232323;
    --muted: #6b6b6b;
    --border: #e2ded7;
    --warn-bg: #fff6df;
    --warn-text: #7a5b00;
    --error-bg: #fdeceb;
    --error-text: #a12b20;
    --app-height: 100vh;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    overscroll-behavior-y: none;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    height: var(--app-height);
    max-width: 640px;
    margin: 0 auto;
    background: var(--bg);
  }

  header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px 16px;
    background: var(--brand);
    color: #fff;
  }

  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 700;
    letter-spacing: 0.2px;
  }

  header .sub {
    font-size: 12px;
    color: rgba(255,255,255,0.85);
    margin-top: 2px;
  }

  #btn-nuevo {
    flex-shrink: 0;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.5);
    color: #fff;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    min-height: 44px;
    min-width: 44px;
  }

  #btn-nuevo:active { background: rgba(255,255,255,0.3); }

  .messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .bubble {
    max-width: 88%;
    padding: 12px 14px;
    border-radius: 16px;
    font-size: 16px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .bubble.user {
    align-self: flex-end;
    background: var(--brand);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .bubble.assistant {
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .bubble.system-hint {
    align-self: center;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    max-width: 100%;
  }

  .order-card {
    align-self: stretch;
    max-width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
  }

  .order-card .row-title {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 6px;
  }

  .order-card .meta {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .order-card table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    margin: 8px 0;
  }

  .order-card td {
    padding: 6px 4px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  .order-card td.num { text-align: right; white-space: nowrap; }

  .order-card .total-row {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 17px;
    padding-top: 8px;
  }

  .order-card .warn {
    background: var(--warn-bg);
    color: var(--warn-text);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    margin-top: 10px;
  }

  .order-card .notas {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
    white-space: pre-wrap;
  }

  .order-card .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .btn {
    min-height: 44px;
    border-radius: 12px;
    border: none;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--brand);
    color: #fff;
    flex: 1;
    min-width: 160px;
  }
  .btn-primary:active { background: var(--brand-dark); }

  .btn-secondary {
    background: #ece9e3;
    color: var(--text);
    min-width: 120px;
  }
  .btn-secondary:active { background: #ddd8cf; }

  .copy-fallback {
    width: 100%;
    margin-top: 8px;
    font-size: 13px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fafafa;
    color: var(--text);
    resize: none;
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  .error-banner {
    flex-shrink: 0;
    background: var(--error-bg);
    color: var(--error-text);
    padding: 10px 16px;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .error-banner button {
    flex-shrink: 0;
    background: var(--error-text);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    min-height: 36px;
  }

  .composer {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--card);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  #texto {
    flex: 1;
    font-size: 16px; /* evita zoom automático en iOS al enfocar */
    font-family: inherit;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    resize: none;
    max-height: 120px;
    min-height: 44px;
    line-height: 1.35;
    background: #fafaf8;
  }

  #texto:focus {
    outline: none;
    border-color: var(--brand);
    background: #fff;
  }

  #btn-enviar {
    flex-shrink: 0;
    min-width: 44px;
    min-height: 44px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--brand);
    color: #fff;
    border: none;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #btn-enviar:active { background: var(--brand-dark); }
  #btn-enviar:disabled { background: #c9c5bd; }

  .composer.sending #texto { opacity: 0.6; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>LYSTO Congelados</h1>
      <div class="sub">Armado de pedidos</div>
    </div>
    <button id="btn-nuevo" type="button">Nuevo pedido</button>
  </header>

  <div class="messages" id="messages">
    <div class="bubble system-hint">Contame el pedido: cliente, productos y cantidades. Por ejemplo: "3 cajas de clásicas y 2 de premium 8x8 para Once Tipos, lista A".</div>
  </div>

  <div class="error-banner" id="error-banner" style="display:none;">
    <span id="error-text">Ocurrió un error.</span>
    <button id="btn-retry" type="button">Reintentar</button>
  </div>

  <form class="composer" id="composer">
    <textarea id="texto" rows="1" placeholder="Escribí el pedido…" enterkeyhint="send" autocomplete="off" autocapitalize="sentences"></textarea>
    <button id="btn-enviar" type="submit" aria-label="Enviar">➤</button>
  </form>
</div>

<script>
(function () {
  var messagesEl = document.getElementById('messages');
  var composerEl = document.getElementById('composer');
  var textoEl = document.getElementById('texto');
  var enviarBtn = document.getElementById('btn-enviar');
  var errorBanner = document.getElementById('error-banner');
  var errorTextEl = document.getElementById('error-text');
  var retryBtn = document.getElementById('btn-retry');
  var nuevoBtn = document.getElementById('btn-nuevo');

  var history = [];       // [{role, content}] enviado tal cual a /api/order
  var isSending = false;
  var lastFailedText = null;
  var typingEl = null;

  // ---- Ajuste de alto real de viewport (evita que el teclado tape el input) ----
  function setAppHeight() {
    var vv = window.visualViewport;
    var h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', setAppHeight);
    window.visualViewport.addEventListener('scroll', setAppHeight);
  }

  function scrollToBottom() {
    requestAnimationFrame(function () {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  function addBubble(role, text) {
    var div = document.createElement('div');
    div.className = 'bubble ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function showTyping() {
    typingEl = document.createElement('div');
    typingEl.className = 'typing';
    typingEl.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(typingEl);
    scrollToBottom();
  }

  function hideTyping() {
    if (typingEl && typingEl.parentNode) typingEl.parentNode.removeChild(typingEl);
    typingEl = null;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function unidadLabel(u) {
    return u === 'cajas' ? 'caja(s)' : 'unidad(es) 2,5kg';
  }

  function money(n) {
    return '$' + Number(n || 0).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function entregaLabel(e) {
    return { flete_interno: 'Flete interno', retira_fabrica: 'Retira de fábrica', flete_externo: 'Flete externo' }[e] || null;
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
      throw new Error('clipboard api no disponible');
    } catch (e) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e2) {
        return false;
      }
    }
  }

  function addOrderCard(pedido, texto) {
    var card = document.createElement('div');
    card.className = 'order-card';

    var cliente = (pedido.cliente && (pedido.cliente.match || pedido.cliente.nombre_detectado)) || 'Cliente';
    var html = '<div class="row-title">' + escapeHtml(cliente) + '</div>';
    var metaParts = [];
    if (pedido.lista_precio) metaParts.push('Lista: ' + escapeHtml(pedido.lista_precio));
    var entregaTxt = entregaLabel(pedido.entrega);
    if (entregaTxt) metaParts.push('Entrega: ' + escapeHtml(entregaTxt));
    if (metaParts.length) html += '<div class="meta">' + metaParts.join(' · ') + '</div>';

    html += '<table>';
    (pedido.items || []).forEach(function (it) {
      html += '<tr><td>' + it.cantidad + ' ' + unidadLabel(it.unidad) + '<br><strong>' + escapeHtml(it.producto) + '</strong></td>' +
        '<td class="num">' + money(it.precio_unitario) + ' c/u<br>' + money(it.subtotal) + '</td></tr>';
    });
    html += '</table>';

    html += '<div class="total-row"><span>TOTAL</span><span>' + money(pedido.total) + '</span></div>';

    if (pedido.advertencias && pedido.advertencias.length) {
      html += '<div class="warn">⚠️ ' + escapeHtml(pedido.advertencias.join(' · ')) + '</div>';
    }
    if (pedido.notas) {
      html += '<div class="notas">' + escapeHtml(pedido.notas) + '</div>';
    }

    html += '<div class="actions">' +
      '<button type="button" class="btn btn-primary" data-action="copy">Copiar para WhatsApp</button>' +
      '<button type="button" class="btn btn-secondary" data-action="nuevo">Nuevo pedido</button>' +
      '</div>';

    card.innerHTML = html;
    messagesEl.appendChild(card);

    var copyBtn = card.querySelector('[data-action="copy"]');
    copyBtn.addEventListener('click', async function () {
      var ok = await copyText(texto);
      if (ok) {
        var original = copyBtn.textContent;
        copyBtn.textContent = 'Copiado ✓';
        setTimeout(function () { copyBtn.textContent = original; }, 1800);
      } else {
        if (!card.querySelector('.copy-fallback')) {
          var fallback = document.createElement('textarea');
          fallback.className = 'copy-fallback';
          fallback.readOnly = true;
          fallback.rows = 4;
          fallback.value = texto;
          card.appendChild(fallback);
          fallback.focus();
          fallback.select();
        }
        copyBtn.textContent = 'Mantené presionado el texto de abajo para copiar';
      }
    });

    card.querySelector('[data-action="nuevo"]').addEventListener('click', resetConversation);

    scrollToBottom();
  }

  function showError(message, retryText) {
    errorTextEl.textContent = message;
    errorBanner.style.display = 'flex';
    lastFailedText = retryText;
  }

  function hideError() {
    errorBanner.style.display = 'none';
    lastFailedText = null;
  }

  function resetConversation() {
    history = [];
    lastFailedText = null;
    hideError();
    messagesEl.innerHTML = '';
    addBubble('system-hint', 'Contame el pedido: cliente, productos y cantidades. Por ejemplo: "3 cajas de clásicas y 2 de premium 8x8 para Once Tipos, lista A".');
    textoEl.value = '';
    autoGrow();
    textoEl.focus();
  }

  async function sendMessage(text) {
    if (isSending) return;
    isSending = true;
    hideError();
    composerEl.classList.add('sending');
    enviarBtn.disabled = true;
    showTyping();

    var controller = new AbortController();
    var timeout = setTimeout(function () { controller.abort(); }, 45000);

    try {
      var res = await fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history.concat([{ role: 'user', content: text }]) }),
        signal: controller.signal
      });

      var data = null;
      try { data = await res.json(); } catch (e) { /* respuesta no-JSON */ }

      if (!res.ok) {
        var msg = (data && data.error) || 'No pudimos enviar el pedido. Probá de nuevo.';
        throw new Error(msg);
      }

      // Éxito: recién ahora confirmamos el mensaje del usuario y limpiamos el textarea.
      addBubble('user', text);
      textoEl.value = '';
      autoGrow();
      history.push({ role: 'user', content: text });

      hideTyping();

      if (data.estado === 'faltan_datos') {
        addBubble('assistant', data.pregunta);
        history.push({ role: 'assistant', content: data.rawText || data.pregunta });
      } else if (data.estado === 'completo') {
        history.push({ role: 'assistant', content: data.rawText || JSON.stringify(data.pedido) });
        addOrderCard(data.pedido, data.texto);
      } else {
        addBubble('assistant', 'No entendí bien la respuesta, ¿podés reformular el pedido?');
      }
    } catch (err) {
      hideTyping();
      var isAbort = err && err.name === 'AbortError';
      var message = isAbort
        ? 'La respuesta tardó demasiado. Revisá tu conexión y reintentá.'
        : (err && err.message) || 'No pudimos conectar con el servidor. Revisá tu conexión y reintentá.';
      showError(message, text);
    } finally {
      clearTimeout(timeout);
      isSending = false;
      composerEl.classList.remove('sending');
      enviarBtn.disabled = false;
    }
  }

  function autoGrow() {
    textoEl.style.height = 'auto';
    textoEl.style.height = Math.min(textoEl.scrollHeight, 120) + 'px';
  }

  textoEl.addEventListener('input', autoGrow);

  composerEl.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = textoEl.value.trim();
    if (!text || isSending) return;
    sendMessage(text);
  });

  textoEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      composerEl.requestSubmit ? composerEl.requestSubmit() : composerEl.dispatchEvent(new Event('submit', { cancelable: true }));
    }
  });

  retryBtn.addEventListener('click', function () {
    if (lastFailedText) sendMessage(lastFailedText);
  });

  nuevoBtn.addEventListener('click', resetConversation);

  autoGrow();
})();
</script>
</body>
</html>
